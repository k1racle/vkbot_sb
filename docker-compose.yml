services:
  vk-bot:
    build: .
    container_name: vk-bot
    restart: unless-stopped
    environment:
      VK_API_VERSION: ${VK_API_VERSION}
      VK_GROUP_ID: ${VK_GROUP_ID}
      VK_GROUP_TOKEN: ${VK_GROUP_TOKEN}
      VK_CALLBACK_SECRET: ${VK_CALLBACK_SECRET}
      VK_CONFIRMATION_CODE: ${VK_CONFIRMATION_CODE}
      DATABASE_URL: ${DATABASE_URL}
      PROMO_CODE: ${PROMO_CODE}
      SHOP_URL: ${SHOP_URL}
      PROMO_MESSAGE: ${PROMO_MESSAGE}
      PROMO_ATTACHMENTS: ${PROMO_ATTACHMENTS}
      MIN_COMMENT_LENGTH: ${MIN_COMMENT_LENGTH}
      STOP_WORDS: ${STOP_WORDS}
      ONE_PROMO_PER_USER: ${ONE_PROMO_PER_USER}
      TEST_MODE: ${TEST_MODE}
      TEST_TRIGGER_PHRASE: ${TEST_TRIGGER_PHRASE}
      ADMIN_TEST_USER_ID: ${ADMIN_TEST_USER_ID}
      CHAT_ENABLED: ${CHAT_ENABLED:-true}
      CHAT_GREETING: ${CHAT_GREETING:-Привет! Я бот магазина. Напишите, чем помочь.}
      OPERATOR_USER_ID: ${OPERATOR_USER_ID}
      OPERATOR_TRIGGER_WORDS: ${OPERATOR_TRIGGER_WORDS:-оператор,менеджер,человек}
      OPERATOR_ACK: ${OPERATOR_ACK:-Передал запрос менеджеру. Скоро с вами свяжутся.}
      ALLOWED_POST_IDS: ${ALLOWED_POST_IDS}
      LOG_LEVEL: ${LOG_LEVEL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - bot_data:/app/data
    networks:
      - proxy
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  bot_data:
  postgres_data:

networks:
  proxy:
    external: true
  backend:
    driver: bridge
